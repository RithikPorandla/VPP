services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weatheredge
      POSTGRES_USER: weatheredge
      POSTGRES_PASSWORD: weatheredge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://weatheredge:weatheredge@db:5432/weatheredge
      DATABASE_URL_SYNC: postgresql+psycopg2://weatheredge:weatheredge@db:5432/weatheredge
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api

volumes:
  pgdata:
